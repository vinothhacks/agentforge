<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AgentForge</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --ink: #e8eef4;
      --muted: #8b9aab;
      --accent: #3d9cf0;
      --warn: #e0a14a;
      --bad: #e05a5a;
      --ok: #5ec98a;
      --line: #2a3542;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    header .sub { color: var(--muted); font-size: 12px; }
    .meter { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
    main { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 54px); }
    aside { border-right: 1px solid var(--line); padding: 16px; background: #12181f; overflow: auto; }
    aside label { display: block; font-size: 11px; color: var(--muted); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .04em; }
    input, textarea, button {
      width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line);
      background: var(--bg); color: var(--ink); font: inherit;
    }
    button { cursor: pointer; background: var(--accent); border: 0; color: #062033; font-weight: 600; margin-top: 8px; }
    button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    a.btn {
      display: block; text-align: center; text-decoration: none; padding: 8px 10px;
      border-radius: 6px; border: 1px solid var(--line); color: var(--ink); margin-top: 8px; font-weight: 600;
    }
    select { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line);
      background: var(--bg); color: var(--ink); font: inherit; margin-top: 6px; }
    .hw { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
    .models { list-style: none; padding: 0; margin: 8px 0 0; max-height: 220px; overflow: auto; }
    .models li { font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
    .models button { width: auto; margin: 4px 0 0; padding: 4px 8px; font-size: 12px; }
    .fit { text-transform: uppercase; font-size: 10px; letter-spacing: .04em; }
    .note { font-size: 12px; color: var(--muted); margin-top: 10px; }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }
    .status { font-size: 13px; margin-top: 6px; }
    .files { list-style: none; padding: 0; margin: 8px 0 0; }
    .files li { display: flex; gap: 8px; align-items: center; font-size: 12px; margin: 0 0 6px; }
    .files span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
    .files a { color: var(--accent); text-decoration: none; flex: none; }
    .chat { display: flex; flex-direction: column; height: calc(100vh - 54px); }
    .log { flex: 1; overflow: auto; padding: 20px; }
    .bubble { max-width: 720px; margin: 0 0 14px; padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; }
    .user { background: #243044; margin-left: auto; }
    .bot { background: var(--panel); border: 1px solid var(--line); }
    .trace { font-size: 12px; color: var(--muted); margin: -8px 0 12px; }
    form.composer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
    form.composer textarea { flex: 1; min-height: 44px; resize: vertical; }
    form.composer button { width: auto; margin: 0; padding: 8px 16px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>AgentForge</h1>
      <div class="sub" id="ws"></div>
    </div>
    <div class="meter" id="meter">tokens 0 / 32000 · $0.00 / $0.50</div>
  </header>
  <main>
    <aside>
      <label>OpenRouter key</label>
      <input id="key" type="password" placeholder="sk-or-…" />
      <button id="saveKey">Save key</button>
      <label>Fast probe (2-min path)</label>
      <button class="ghost" id="probe">Run fast probe</button>
      <div id="probeOut" class="sub"></div>

      <label>llmfit</label>
      <div id="llmfitOut" class="status">checking llmfit…</div>
      <button class="ghost" id="installLlmfit">Install llmfit</button>
      <a class="btn" id="llmfitPypi" href="https://pypi.org/project/llmfit/" target="_blank" rel="noreferrer">Download llmfit (PyPI)</a>
      <div id="hw" class="hw"></div>

      <label>Model that fits this PC</label>
      <div id="currentModel" class="status">loading models…</div>
      <select id="modelPick"></select>
      <button id="useModel">Use selected model</button>
      <button class="ghost" id="pullModel">Download selected with Ollama</button>
      <button class="ghost" id="scan">Auto-pick best installed local model</button>
      <div id="scanOut" class="sub"></div>
      <ul class="models" id="modelList"></ul>

      <label>Ollama</label>
      <div id="ollamaOut" class="status">checking Ollama…</div>
      <a class="btn primary" href="https://ollama.com/download" target="_blank" rel="noreferrer">Download Ollama</a>

      <label>Workspace files</label>
      <ul class="files" id="fileList"></ul>
      <a class="btn" id="chatDl" href="/api/export/chat">Download chat (.md)</a>
      <div id="ingestWarn" class="note"></div>
    </aside>
    <section class="chat">
      <div class="log" id="log"></div>
      <form class="composer" id="form">
        <textarea id="msg" placeholder="Ask about files in this folder…"></textarea>
        <button type="submit">Ask</button>
      </form>
    </section>
  </main>
  <script>
    const log = document.getElementById("log");
    const meter = document.getElementById("meter");
    let session = "default";

    function add(role, text, extra) {
      const d = document.createElement("div");
      d.className = "bubble " + (role === "user" ? "user" : "bot");
      d.textContent = text;
      log.appendChild(d);
      if (extra) {
        const t = document.createElement("div");
        t.className = "trace";
        t.textContent = extra;
        log.appendChild(t);
      }
      log.scrollTop = log.scrollHeight;
    }

    async function j(url, opts) {
      const r = await fetch(url, opts);
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.detail || JSON.stringify(data));
      return data;
    }

    function renderLocal(s) {
      const lf = document.getElementById("llmfitOut");
      lf.className = "status " + (s.llmfit ? "ok" : "bad");
      lf.textContent = s.llmfit
        ? "llmfit is installed."
        : "llmfit not found. Install it here or: " + (s.llmfit_install || "uv tool install llmfit");
      if (s.llmfit_pypi) document.getElementById("llmfitPypi").href = s.llmfit_pypi;
      const ol = document.getElementById("ollamaOut");
      ol.className = "status " + (s.ollama ? "ok" : "bad");
      ol.textContent = s.ollama ? "Ollama is installed." : "Ollama not found. Use Download Ollama above.";
      const sys = s.system || {};
      const ram = s.available_ram_gb || sys.available_ram_gb;
      const bits = [];
      if (sys.cpu_name) bits.push(sys.cpu_name);
      if (ram) bits.push(Number(ram).toFixed(1) + " GB free RAM");
      if (sys.total_ram_gb) bits.push("of " + Number(sys.total_ram_gb).toFixed(1) + " GB");
      if (sys.gpu_name && sys.gpu_name !== "Name") bits.push("GPU " + sys.gpu_name);
      else if (sys.has_gpu) bits.push("GPU present, VRAM unknown (CPU fit used)");
      document.getElementById("hw").textContent = bits.join(" · ");
    }

    function fillModels(s) {
      const cur = s.current || {};
      document.getElementById("currentModel").textContent =
        "Using " + (cur.provider || "?") + " / " + (cur.name || "?");
      const pick = document.getElementById("modelPick");
      pick.innerHTML = "";
      const opts = [];
      opts.push({ value: "openrouter|openai/gpt-4o-mini", label: "Cloud · openai/gpt-4o-mini" });
      (s.installed || []).forEach((m) => {
        opts.push({
          value: "ollama|" + m.name,
          label: "Installed · " + m.name + " · " + (m.fit_level || "") + (m.size_gb ? " · " + m.size_gb + " GB" : ""),
        });
      });
      (s.suggested || []).forEach((m) => {
        opts.push({
          value: "ollama|" + m.name,
          label: "Fits PC · " + m.name + " · " + (m.fit_level || "") + " · pull " + (m.size_gb || "") + " GB",
        });
      });
      opts.forEach((o) => {
        const el = document.createElement("option");
        el.value = o.value;
        el.textContent = o.label;
        pick.appendChild(el);
      });
      const want = (cur.provider || "openrouter") + "|" + (cur.name || "openai/gpt-4o-mini");
      if ([...pick.options].some((o) => o.value === want)) pick.value = want;

      const ul = document.getElementById("modelList");
      ul.innerHTML = "";
      function addRow(title, m, extra) {
        const li = document.createElement("li");
        li.innerHTML = "<strong>" + title + "</strong> <span class='fit'>" + (m.fit_level || "") + "</span><br/>" + extra;
        ul.appendChild(li);
      }
      (s.installed || []).forEach((m) => addRow(m.name, m, "installed · " + (m.size_gb || "?") + " GB"));
      (s.suggested || []).slice(0, 6).forEach((m) => addRow(m.name, m, (m.notes || "library") + " · not pulled yet"));
      (s.recommended || []).slice(0, 5).forEach((m) => {
        addRow(
          m.name,
          m,
          "llmfit " + (m.parameter_count || "") + " · RAM " + (m.memory_required_gb || "?") + " GB · " + (m.run_mode || "")
        );
      });
    }

    async function loadModels() {
      document.getElementById("currentModel").textContent = "scoring models against this PC…";
      const s = await j("/api/models");
      renderLocal(s);
      fillModels(s);
      return s;
    }

    async function loadFiles() {
      const data = await j("/api/files");
      const ul = document.getElementById("fileList");
      ul.innerHTML = "";
      (data.files || []).forEach((f) => {
        const li = document.createElement("li");
        const name = document.createElement("span");
        name.textContent = f.path;
        name.title = f.path;
        const a = document.createElement("a");
        a.href = "/api/download/file?path=" + encodeURIComponent(f.path);
        a.textContent = "Download";
        li.appendChild(name);
        li.appendChild(a);
        ul.appendChild(li);
      });
      if (!(data.files || []).length) {
        ul.innerHTML = "<li><span>No PDF / txt / md / docx files in this folder.</span></li>";
      }
    }

    async function boot() {
      const h = await j("/api/health");
      document.getElementById("ws").textContent = h.workspace + (h.ingested ? " · indexed" : " · not ingested");
      const w = await j("/api/ingest/warnings");
      if (w.no_text_layer_count) {
        document.getElementById("ingestWarn").textContent =
          w.no_text_layer_count + " files have no text layer and will miss lexical search.";
      }
      renderLocal(await j("/api/scan"));
      await loadFiles();
      loadModels().catch((e) => {
        document.getElementById("currentModel").textContent = String(e);
      });
    }

    document.getElementById("saveKey").onclick = async () => {
      await j("/api/key", { method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ key: document.getElementById("key").value }) });
      add("bot", "Key saved. Ask a question — or run the fast probe first.");
    };

    document.getElementById("probe").onclick = async () => {
      document.getElementById("probeOut").textContent = "probing…";
      try {
        const c = await j("/api/probe", { method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ provider: "openrouter", name: "openai/gpt-4o-mini", mode: "fast" }) });
        document.getElementById("probeOut").textContent =
          c.verdict + " · lo95=" + (c.measured && c.measured.per_step_success_lo95) + " · steps=" + (c.measured && c.measured.max_steps);
      } catch (e) {
        document.getElementById("probeOut").textContent = String(e);
      }
    };

    document.getElementById("useModel").onclick = async () => {
      const raw = document.getElementById("modelPick").value;
      const [provider, name] = raw.split("|");
      document.getElementById("scanOut").textContent = "pinning " + name + "…";
      try {
        const r = await j("/api/model", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ provider, name, probe: false }),
        });
        document.getElementById("scanOut").textContent = "Using " + r.model_pin.provider + " / " + r.model_pin.name;
        document.getElementById("currentModel").textContent = "Using " + r.model_pin.provider + " / " + r.model_pin.name;
        add("bot", "Model set to " + r.model_pin.provider + " / " + r.model_pin.name + ". Ask a question.");
      } catch (e) {
        document.getElementById("scanOut").textContent = String(e);
      }
    };

    document.getElementById("pullModel").onclick = async () => {
      const raw = document.getElementById("modelPick").value;
      const [provider, name] = raw.split("|");
      if (provider !== "ollama") {
        document.getElementById("scanOut").textContent = "Pull is for Ollama tags only.";
        return;
      }
      document.getElementById("scanOut").textContent = "ollama pull " + name + " (this can take several minutes)…";
      try {
        await j("/api/ollama/pull", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ name }),
        });
        await j("/api/model", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ provider: "ollama", name, probe: false }),
        });
        document.getElementById("scanOut").textContent = "Downloaded and pinned " + name;
        await loadModels();
        add("bot", "Downloaded " + name + " with Ollama and set it as the active model.");
      } catch (e) {
        document.getElementById("scanOut").textContent = String(e);
      }
    };

    document.getElementById("installLlmfit").onclick = async () => {
      document.getElementById("llmfitOut").textContent = "installing llmfit…";
      try {
        const r = await j("/api/install/llmfit", { method: "POST" });
        renderLocal(await j("/api/scan"));
        add("bot", r.llmfit ? "llmfit is installed. Loading models that fit this PC…" : "llmfit install finished. Check the sidebar.");
        await loadModels();
      } catch (e) {
        document.getElementById("llmfitOut").className = "status bad";
        document.getElementById("llmfitOut").textContent = String(e);
      }
    };

    document.getElementById("scan").onclick = async () => {
      document.getElementById("scanOut").textContent = "picking a local model that fits…";
      try {
        const r = await j("/api/scan/run", { method: "POST", headers: {"Content-Type":"application/json"}, body: "{}" });
        document.getElementById("scanOut").textContent = r.english || r.reason || (r.ok ? "local pin ok" : "staying on cloud");
        await loadModels();
      } catch (e) {
        document.getElementById("scanOut").textContent = String(e);
      }
    };

    document.getElementById("chatDl").onclick = (ev) => {
      ev.preventDefault();
      window.location.href = "/api/export/chat?session_id=" + encodeURIComponent(session);
    };

    document.getElementById("form").onsubmit = async (ev) => {
      ev.preventDefault();
      const text = document.getElementById("msg").value.trim();
      if (!text) return;
      document.getElementById("msg").value = "";
      add("user", text);
      try {
        const r = await j("/api/chat", { method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ message: text, session_id: session }) });
        session = r.session_id;
        const tools = (r.traces || []).filter(t => t.kind === "tool").map(t => t.tool).join(", ");
        add("bot", r.text || "(no text)", tools ? "tools: " + tools : "");
        if (r.eval && r.eval.enumeration) {
          add("bot", "enumeration recall " + r.eval.enumeration.recall +
            (r.eval.enumeration.cause ? " · FAIL " + r.eval.enumeration.cause : " · pass"));
        }
        const u = r.usage || {};
        meter.textContent = `tokens ${u.prompt_tokens || 0} / ${u.max_tokens || 32000} · $${(u.usd || 0).toFixed(4)} / $${u.max_usd || 0.5}`;
      } catch (e) {
        add("bot", String(e));
      }
    };

    boot().catch((e) => add("bot", String(e)));
  </script>
</body>
</html>

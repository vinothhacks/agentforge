[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentforge"
version = "0.1.0"
description = "Convert any LLM into an AI agent. OpenRouter-first PDA-query agent."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "AgentForge" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "litellm>=1.60.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "pydantic>=2.9.0",
  "httpx>=0.27.0",
  "pypdf>=5.0.0",
  "lancedb>=0.17.0",
  "numpy>=1.26.0",
  "jsonschema>=4.23.0",
  "pyyaml>=6.0.2",
  "python-multipart>=0.0.12",
  "websockets>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
agentforge = "gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
